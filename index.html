<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.mk Domain Availability — Macedonian Names</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2c3a4a;
    --txt:#e6edf3; --mut:#8b9bb0; --acc:#4cc2ff; --free:#3fb950;
    --taken:#f85149; --err:#d29922; --male:#7ee787; --female:#ff9ecb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4}
  header{padding:22px 26px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px;letter-spacing:.3px}
  h1 small{color:var(--mut);font-weight:400;font-size:13px}
  .updated{color:var(--mut);font-size:12px;margin-top:4px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px 60px}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;position:relative;overflow:hidden}
  .card .n{font-size:26px;font-weight:700}
  .card .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card.free .n{color:var(--free)} .card.taken .n{color:var(--taken)}
  .card.err .n{color:var(--err)} .card.male .n{color:var(--male)} .card.female .n{color:var(--female)}
  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
  input[type=text]{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);padding:10px 12px;border-radius:9px;font-size:14px;outline:none}
  input[type=text]:focus{border-color:var(--acc)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);
    padding:7px 13px;border-radius:20px;cursor:pointer;font-size:13px;user-select:none;transition:.15s}
  .chip:hover{border-color:var(--acc)}
  .chip.on{background:var(--acc);color:#06121c;border-color:var(--acc);font-weight:600}
  .chip.on.free{background:var(--free);color:#04130a;border-color:var(--free)}
  .chip.on.taken{background:var(--taken);color:#1a0606;border-color:var(--taken)}
  .chip.on.male{background:var(--male);color:#06140a;border-color:var(--male)}
  .chip.on.female{background:var(--female);color:#1a0610;border-color:var(--female)}
  /* table */
  .count{color:var(--mut);font-size:13px;margin:10px 2px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
  th{background:var(--panel2);color:var(--mut);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;position:relative}
  th:hover{color:var(--txt)}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:var(--panel2)}
  .dom{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .b-free{background:rgba(63,185,80,.16);color:var(--free)}
  .b-taken{background:rgba(248,81,73,.16);color:var(--taken)}
  .b-err{background:rgba(210,153,34,.16);color:var(--err)}
  .g{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .g-male{color:var(--male)} .g-female{color:var(--female)} .g-unk{color:var(--mut)}
  .rk{color:var(--mut);font-size:12px}
  .note{color:var(--mut);font-size:12px;margin:14px 0 0;padding:10px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .empty{padding:40px;text-align:center;color:var(--mut)}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>.mk Domain Availability <small>— Macedonian given names (Latin)</small></h1>
  <div class="updated" id="updated">loading…</div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search name or domain…" oninput="render()">
    <div class="chips">
      <span class="chip on" data-f="all" onclick="toggleFilter('status','all',this)">All</span>
      <span class="chip free" data-f="free" onclick="toggleFilter('status','free',this)">Free</span>
      <span class="chip taken" data-f="taken" onclick="toggleFilter('status','taken',this)">Taken</span>
      <span class="chip err" data-f="error" onclick="toggleFilter('status','error',this)">Error</span>
    </div>
    <div class="chips">
      <span class="chip on" data-g="all" onclick="toggleFilter('gender','all',this)">Any</span>
      <span class="chip male" data-g="male" onclick="toggleFilter('gender','male',this)">Male</span>
      <span class="chip female" data-g="female" onclick="toggleFilter('gender','female',this)">Female</span>
    </div>
  </div>

  <div class="count" id="count"></div>
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('name')">Name</th>
        <th onclick="sortBy('domain')">Domain</th>
        <th onclick="sortBy('status')">Status</th>
        <th onclick="sortBy('gender')">Gender</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No matches.</div>

  <div class="note">Static snapshot — data collected via WHOIS (whois.marnet.mk). Live re-checks require the <a href="https://github.com/KinDzaDzaSki/iminja.mk" style="color:var(--acc)">Python backend</a>.</div>
</div>

<script>
let DATA = {records:[], stats:{}};
let filt = {status:'all', gender:'all'};
let sortKey = 'name', sortDir = 1;

async function load(){
  const r = await fetch('data.json');
  DATA = await r.json();
  paintStats();
  render();
}
function paintStats(){
  const s = DATA.stats;
  document.getElementById('updated').textContent = 'Last updated: ' + (new Date().toLocaleString());
  document.getElementById('stats').innerHTML = `
    <div class="card"><div class="n">${s.total}</div><div class="l">Total</div></div>
    <div class="card free"><div class="n">${s.free}</div><div class="l">Free</div></div>
    <div class="card taken"><div class="n">${s.taken}</div><div class="l">Taken</div></div>
    <div class="card male"><div class="n">${s.male}</div><div class="l">Male</div></div>
    <div class="card female"><div class="n">${s.female}</div><div class="l">Female</div></div>`;
}
function toggleFilter(kind, val, el){
  filt[kind] = val;
  const group = el.parentElement;
  [...group.children].forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  render();
}
function sortBy(k){
  if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;}
  render();
}
function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = DATA.records.slice();
  if(filt.status!=='all') rows = rows.filter(r=>r.status===filt.status);
  if(filt.gender!=='all') rows = rows.filter(r=>r.gender===filt.gender);
  if(q) rows = rows.filter(r=>(r.name+' '+r.domain).toLowerCase().includes(q));
  rows.sort((a,b)=>{
    let x=a[sortKey]||'', y=b[sortKey]||'';
    if(sortKey==='status'){const ord={free:0,taken:1,error:2};x=ord[x]??3;y=ord[y]??3;return (x-y)*sortDir;}
    return (x<y?-1:x>y?1:0)*sortDir;
  });
  const tb = document.getElementById('rows');
  tb.innerHTML = rows.map(r=>{
    const cls = r.status==='free'?'b-free':r.status==='taken'?'b-taken':'b-err';
    const gcls = 'g-'+(r.gender==='male'?'male':r.gender==='female'?'female':'unk');
    return `<tr>
      <td>${esc(r.name)}</td>
      <td class="dom">${esc(r.domain)}</td>
      <td><span class="badge ${cls}">${r.status}</span></td>
      <td><span class="g ${gcls}">${esc(r.gender)}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('count').textContent = rows.length + ' of ' + DATA.records.length + ' shown';
  document.getElementById('empty').style.display = rows.length? 'none':'block';
}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
load();
</script>
</body>
</html>
